# Tests on every push to main. Linux runs the whole suite and the coverage
# matrix (eval/results/coverage.md): every cell the docs claim must be
# protected, and no stranger may ever get a key; and the attack replays
# (eval/results/replays.md): no real key leaves, and every send is stopped. Windows runs the same
# suites (coverage-windows.md, replays-windows.md). Only Node.js is hooked there so far (PAR-08), so
# Node.js must be protected and stopped there, and every other cell is written up as exposed.
# macOS runs the seal crate and app tests (one universal build serves Intel and Apple silicon).
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tauri's Linux libraries, and the matrix's clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libdbus-1-dev libssl-dev patchelf file \
            python3-requests ruby curl
          python3 -m pip install --quiet httpx
      - name: platform code only in src-tauri/src/os (ADR 0006)
        run: bash scripts/check-platform-code.sh
      - name: every gap in docs/parity.md names an issue
        run: bash scripts/check-parity-doc.sh
      - run: npm ci && npm run build
      - name: seal crate
        run: cargo test
        working-directory: crates/seal
      - name: app
        run: cargo test
        working-directory: src-tauri
      - name: coverage matrix
        run: cargo test --lib coverage_matrix -- --ignored --nocapture
        working-directory: src-tauri
      - name: attack replays
        run: cargo test --lib attack_replays -- --ignored --nocapture
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-linux
          path: eval/results/

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: app
        run: cargo test
        working-directory: src-tauri
      - name: the matrix's clients
        run: python -m pip install --quiet requests httpx
      # Git for Windows' sh, curl and openssl go after everything else on
      # PATH, so they never shadow the MSVC linker.
      - name: coverage matrix
        shell: pwsh
        run: |
          $env:Path += ';C:\Program Files\Git\usr\bin;C:\Program Files\Git\mingw64\bin'
          cargo test --lib coverage_matrix -- --ignored --nocapture
        working-directory: src-tauri
      - name: attack replays
        shell: pwsh
        run: |
          $env:Path += ';C:\Program Files\Git\usr\bin;C:\Program Files\Git\mingw64\bin'
          cargo test --lib attack_replays -- --ignored --nocapture
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-windows
          path: eval/results/

  macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: seal crate
        run: cargo test
        working-directory: crates/seal
      - name: app
        run: cargo test
        working-directory: src-tauri
