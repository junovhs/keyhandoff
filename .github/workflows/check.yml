# Tests on every push to main. Linux runs the whole suite and the coverage
# matrix (eval/results/coverage.md): every cell the docs claim must be
# protected, and no stranger may ever get a key. Windows builds the app and
# runs its tests, since placeholders and the TLS hook are Linux only so far.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tauri's Linux libraries, and the matrix's clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libdbus-1-dev libssl-dev patchelf file \
            python3-requests ruby curl
          python3 -m pip install --quiet httpx
      - run: npm ci && npm run build
      - name: seal crate
        run: cargo test
        working-directory: crates/seal
      - name: app
        run: cargo test
        working-directory: src-tauri
      - name: coverage matrix
        run: cargo test --lib coverage_matrix -- --ignored --nocapture
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-linux
          path: eval/results/

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: app
        run: cargo test
        working-directory: src-tauri
