name: deploy-site
# Builds keyhandoff.dev and deploys it to Cloudflare whenever the site, or the app
# styles and art the site draws its mock windows with, change on main.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/styles.css'
      - 'src/art-paths.ts'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # The download section reads the latest release from GitHub at build time.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 160d0b3e0853c977c068cfca57526f34
