name: release
# A version in src-tauri/Cargo.toml with no vX.Y.Z release yet becomes a DRAFT
# GitHub Release: a Windows installer, a Linux .deb and AppImage, and SHA256SUMS,
# with CHANGELOG.md's section for that version as its notes. CI holds no signing
# key (ADR 0005): the owner signs the packages offline and publishes the draft
# with scripts/sign-release.sh (docs/releasing.md). Publishing makes the tag, and
# refresh-site.yml then rebuilds the website. CI never writes to main or CHANGELOG.md.
on:
  push:
    branches: [main]
    # CHANGELOG.md too: notes written after a bump still release that version.
    paths: ["src-tauri/Cargo.toml", "CHANGELOG.md", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  plan:
    runs-on: ubuntu-latest
    # Write access only so the token can see draft releases.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: version, tag, draft and changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=notes.md bash scripts/release-plan.sh | tee -a "$GITHUB_OUTPUT"
          [ ! -f notes.md ] || cat notes.md

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          # 22.04 (glibc 2.35), not ubuntu-latest: a build on newer glibc won't
          # start on older distributions.
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libdbus-1-dev libssl-dev patchelf file
      - run: npm ci
      - name: build ${{ matrix.bundles }}, unsigned
        # No updater key here: installed copies accept only packages signed with
        # it, and only the owner's machine holds it (ADR 0005). The updater
        # artifacts are the packages themselves, signed later by sign-release.sh.
        shell: bash
        run: npx tauri build --ci --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: name the packages
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.plan.outputs.version }}"
          b=src-tauri/target/release/bundle
          mkdir -p dist
          take() { cp "$b/$1" "dist/$2"; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            take nsis/KeyHandoff_"$v"_x64-setup.exe "keyhandoff-$v-windows-x64-setup.exe"
          else
            take deb/KeyHandoff_"$v"_amd64.deb "keyhandoff-$v-linux-amd64.deb"
            take appimage/KeyHandoff_"$v"_amd64.AppImage "keyhandoff-$v-linux-x86_64.AppImage"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: dist/keyhandoff-*
          if-no-files-found: error

  draft:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: draft v${{ needs.plan.outputs.version }}
        # A draft is invisible to installed copies and to the site. The hashes
        # printed here are what sign-release.sh checks the download against.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ needs.plan.outputs.version }}"
          bash scripts/release-notes.sh "$v" > notes.md
          (cd release-assets && sha256sum -- keyhandoff-* > SHA256SUMS && cat SHA256SUMS)
          gh release create "v$v" release-assets/keyhandoff-* release-assets/SHA256SUMS --draft --target "$GITHUB_SHA" \
            --title "KeyHandoff $v" --notes-file notes.md
