name: release
# A version in src-tauri/Cargo.toml with no vX.Y.Z tag yet becomes a GitHub Release:
# a Windows installer, a Linux .deb and AppImage, and SHA256SUMS, with CHANGELOG.md's
# section for that version as its notes. Then the website rebuilds so its download
# links point at it. CI never writes to main or CHANGELOG.md.
on:
  push:
    branches: [main]
    # CHANGELOG.md too: notes written after a bump still release that version.
    paths: ["src-tauri/Cargo.toml", "CHANGELOG.md", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: version, tag and changelog section
        run: |
          set -euo pipefail
          NOTES=notes.md bash scripts/release-plan.sh | tee -a "$GITHUB_OUTPUT"
          [ ! -f notes.md ] || cat notes.md

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          # 22.04 (glibc 2.35), not ubuntu-latest: a build on newer glibc won't
          # start on older distributions.
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libdbus-1-dev libssl-dev patchelf file
      - run: npm ci
      - name: build ${{ matrix.bundles }}
        # The updater key signs each package; installed copies accept only
        # packages signed with it (the public half is in tauri.conf.json).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci --bundles ${{ matrix.bundles }}
      - name: name the packages
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.plan.outputs.version }}"
          b=src-tauri/target/release/bundle
          mkdir -p dist
          take() { cp "$b/$1" "dist/$2"; cp "$b/$1.sig" "dist/$2.sig"; }
          if [ "$RUNNER_OS" = "Windows" ]; then
            take nsis/KeyHandoff_"$v"_x64-setup.exe "keyhandoff-$v-windows-x64-setup.exe"
          else
            take deb/KeyHandoff_"$v"_amd64.deb "keyhandoff-$v-linux-amd64.deb"
            take appimage/KeyHandoff_"$v"_amd64.AppImage "keyhandoff-$v-linux-x86_64.AppImage"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: dist/keyhandoff-*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: publish v${{ needs.plan.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ needs.plan.outputs.version }}"
          bash scripts/release-notes.sh "$v" > notes.md
          bash scripts/updater-manifest.sh "$v" release-assets notes.md > release-assets/latest.json
          cat release-assets/latest.json
          (cd release-assets && sha256sum -- keyhandoff-* > SHA256SUMS && cat SHA256SUMS)
          gh release create "v$v" release-assets/keyhandoff-* release-assets/SHA256SUMS release-assets/latest.json --target "$GITHUB_SHA" \
            --title "KeyHandoff $v" --notes-file notes.md

  refresh-site:
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/refresh-site.yml
    with:
      release_tag: v${{ needs.plan.outputs.version }}
    secrets:
      CLOUDFLARE_SITE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_SITE_DEPLOY_HOOK }}
