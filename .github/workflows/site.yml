name: site
# Checks keyhandoff.dev still builds whenever the site, or the app styles and
# art the site draws its mock windows with, change. It doesn't deploy: the
# owner does, from their own computer, with scripts/deploy-site.sh, so the
# repository holds no Cloudflare credential (ADR 0005).
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/styles.css', 'src/art-paths.ts', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'src/styles.css', 'src/art-paths.ts', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # The download section reads the latest release from GitHub at build time.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
