<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KeyHandoff screen board</title>
    <style>
      body { margin: 0; padding: 48px; background: #101114; color: #e8e8e8; font: 15px/1.4 system-ui, sans-serif; width: max-content; }
      h1 { margin: 0 0 8px; font-size: 26px; }
      .lead { margin: 0 0 40px; color: #9aa0aa; }
      .flow { margin-bottom: 56px; }
      .flow h2 { margin: 0 0 16px; font-size: 19px; }
      .row { display: flex; align-items: flex-start; gap: 12px; }
      .step { display: flex; flex-direction: column; gap: 8px; }
      .step figcaption { font-size: 13px; color: #9aa0aa; }
      .step figcaption b { color: #e8e8e8; font-weight: 600; }
      .step iframe { width: 400px; border: 0; border-radius: 8px; background: #000; box-shadow: 0 0 0 1px #2a2d33; }
      .arrow { align-self: center; color: #5b616b; font-size: 26px; padding: 0 2px; margin-top: 28px; }
      figure { margin: 0; }
    </style>
  </head>
  <body>
    <h1>KeyHandoff screens</h1>
    <p class="lead">Every screen with sample data, in the order people meet them. All screens share one window size.</p>
    <main id="board"></main>
    <script type="module">
      // [scene, who, what, window height, buttons to press once loaded, in order]
      const MAIN = 600, SAFE = 600;
      const FLOWS = [
        ["Share your card (once)", [
          ["home-empty", "Ann", "Starts with no keys", MAIN],
          ["card", "Ann", "Your card, copied to send", MAIN],
          ["added", "Ben", "Opens Ann's card", MAIN],
        ]],
        ["Send a key", [
          ["home-ben", "Ben", "Send a key: picks Ann", MAIN, ["Send a key"]],
          ["home-ben", "Ben", "Picks one of his saved keys", MAIN, ["Send a key", "Ann"]],
          ["sealed", "Ben", "Sends the sealed file", SAFE],
          ["home-low", "Ben", "Priya's card is running out", MAIN, ["Send a key"]],
          ["sealed-used-up", "Ben", "The last send on Ann's card", SAFE],
          ["accepted", "Ann", "Opens it", MAIN],
          ["home", "Ann", "Has the key", MAIN],
        ]],
        ["Share with a team", [
          ["home-ben", "Ben", "New team or Edit: name, people, Welcome", MAIN, ["Send a key", "Edit"]],
          ["home-ben", "Ben", "Picks the team, then a saved key", MAIN, ["Send a key", "Platform"]],
          ["sealed-team", "Ben", "One file for the whole team", SAFE],
          ["home-team", "Cat", "Welcomed: every team key", MAIN],
        ]],
        ["Team folders", [
          ["folder-new", "Ben", "New team: keep it in a shared folder", MAIN, ["Send a key", "New team"]],
          ["invite", "Ann", "Opens invite.handoff in the folder", MAIN],
          ["folder-waiting", "Ann", "Waits for Ben to add her", MAIN, ["Send a key"]],
          ["folder-asking", "Ben", "Ann and Priya ask to join", MAIN, ["Send a key"]],
          ["folder-kept", "Ben", "Both are on the team", MAIN, ["Send a key"]],
        ]],
        ["Add a key", [
          ["listening-you", "You", "Clicks Add a key", SAFE],
          ["caught-you", "You", "Copies the key", SAFE],
          ["home-added", "You", "Has the key", MAIN],
        ]],
        ["Use a key in a program", [
          ["program", "You", "A script asks for a key", MAIN],
          ["home-copied", "You", "Copy .env line on a key row", MAIN],
        ]],
        ["Lock and unlock", [
          ["setup", "You", "First start: choose a passphrase", MAIN],
          ["setup", "You", "Or take five suggested words", MAIN, ["Suggest five"]],
          ["recovery", "You", "Write down the recovery code", MAIN],
          ["locked", "You", "Locked again after sleep or screen lock", MAIN],
          ["home", "You", "Security: how it opens", MAIN, ["Security"]],
          ["home", "You", "Add a PIN (needs a TPM)", MAIN, ["Security", "Add a PIN"]],
          ["locked-pin", "You", "With a PIN, it asks for that first", MAIN],
          ["home", "You", "Remember on this computer, and its warning", MAIN, ["Security", "Remember here"]],
          ["migrate", "You", "An older profile moves behind a passphrase", MAIN],
        ]],
        ["When it doesn't go to plan", [
          ["listening-apps", "You", "A clipboard app is running", SAFE],
          ["listening-read-app", "You", "Something read the bait, and Ditto is running", SAFE],
          ["listening-read", "You", "Something read the bait, nothing known running", SAFE],
          ["timeout", "You", "Time runs out", SAFE],
        ]],
      ];
      const board = document.getElementById("board");
      let n = 0;
      for (const [title, steps] of FLOWS) {
        const flow = document.createElement("section");
        flow.className = "flow";
        flow.innerHTML = `<h2>${title}</h2><div class="row"></div>`;
        const row = flow.querySelector(".row");
        steps.forEach(([scene, who, what, height, press], i) => {
          if (i > 0) row.insertAdjacentHTML("beforeend", `<span class="arrow">→</span>`);
          n += 1;
          row.insertAdjacentHTML(
            "beforeend",
            `<figure class="step"><figcaption><b>${n}. ${who}</b> · ${what}</figcaption><iframe src="./index.html?s=${scene}" style="height:${height}px" title="${what}"></iframe></figure>`,
          );
          if (press) {
            const frame = row.lastElementChild.querySelector("iframe");
            frame.addEventListener("load", () => {
              const queue = [...press];
              const click = () => {
                if (!queue.length) return;
                const button = [...frame.contentDocument.querySelectorAll("button")].find((b) => b.textContent.trim().startsWith(queue[0]));
                if (button) {
                  button.click();
                  queue.shift();
                }
                setTimeout(click, 150);
              };
              click();
            });
          }
        });
        board.append(flow);
      }
    </script>
  </body>
</html>
