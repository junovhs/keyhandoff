[package]
name = "keyhandoff"
version = "0.1.0"
description = "Hand off and use secrets without anyone seeing them"
edition = "2021"
license-file = "../LICENSE.md"
# The app; `keyhandoff-cli` is the console `keyhandoff` command for Windows terminals.
default-run = "keyhandoff"

[lib]
name = "keyhandoff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Builds the TLS hook `keyhandoff run` preloads on Linux (hook/keyhandoff_tls.c).
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
keyhandoff-seal = { path = "../crates/seal" }
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
argon2 = "0.5"
tauri-plugin-updater = "2"
# The folder picker for team folders, called from Rust; the screens get only the path.
tauri-plugin-dialog = "2"
# Nearby: finding other KeyHandoffs on the local network, without a server.
mdns-sd = "0.13"
# The pairing code both people compare.
sha2 = "0.10"

[dev-dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
gtk = "0.18"
# Whether the screen is locked (logind's LockedHint); keyring already uses it.
dbus = "0.9"
# SO_PEERCRED: which program is asking for a key.
libc = "0.2"

# Same version Tauri already pulls in, so there is one copy of the crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Foundation_Collections",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Wdk_System_Threading",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
] }

# Small and fast to start: the performance budget in docs/keyhandoff/architecture.md.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Argon2id at 256 MiB takes minutes unoptimised; dev builds unlock in seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
